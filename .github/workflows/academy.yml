name: Academy checks

on:
  pull_request:
    paths:
      - "academy/**"
      - ".github/workflows/academy.yml"
  push:
    branches:
      - feature/academy-gated-learning-path
    paths:
      - "academy/**"
      - ".github/workflows/academy.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check academy/assets/curriculum.js
          node --check academy/assets/state.js
          node --check academy/assets/assessments.js
          node --check academy/assets/academy.js
          node --check academy/courses/expansion.js
      - name: Run Academy tests
        run: node academy/tests/academy.test.cjs
