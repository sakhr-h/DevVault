<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DevVault | خزينة المطور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { ink: '#0e1420', panel: '#151d2e', well: '#0b101a', line: '#243049', fog: '#8a96ad', accent: '#7aa2ff' },
    fontFamily: {
      sans: ['"IBM Plex Sans Arabic"', 'Tahoma', 'sans-serif'],
      mono: ['"JetBrains Mono"', 'ui-monospace', 'Consolas', 'monospace']
    }
  } }
};
</script>
<style>
  :root { color-scheme: dark; }
  :focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; }
  dialog::backdrop { background: rgba(5, 8, 14, .72); }
  pre::-webkit-scrollbar, textarea::-webkit-scrollbar { height: 8px; width: 8px; }
  pre::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb { background: #243049; border-radius: 4px; }
</style>
</head>
<body class="bg-ink text-slate-100 font-sans min-h-screen antialiased">

<header class="max-w-6xl mx-auto px-5 pt-10 pb-6">
  <div class="flex items-baseline gap-4 flex-wrap">
    <h1 class="font-mono font-semibold text-4xl tracking-tight" dir="ltr">DevVault</h1>
    <span class="text-xl text-fog">خزينة المطور</span>
  </div>
  <p class="mt-3 text-fog max-w-xl leading-7">احفظ أوامرك وسكربتاتك المفضلة في مكان واحد، وانسخها بضغطة واحدة.</p>
</header>

<main class="max-w-6xl mx-auto px-5 pb-16">
  <div class="flex flex-col sm:flex-row gap-3">
    <input id="search" type="search" placeholder="ابحث في العناوين والأكواد…" aria-label="بحث"
      class="flex-1 rounded-lg bg-panel border border-line px-4 py-3 placeholder:text-fog">
    <button id="addBtn" type="button"
      class="rounded-lg bg-accent text-ink font-semibold px-5 py-3 hover:brightness-110">إضافة سكربت جديد</button>
  </div>

  <div class="mt-4 flex items-center justify-between gap-3 flex-wrap">
    <div id="chips" class="flex gap-2 flex-wrap" role="group" aria-label="التصنيف"></div>
    <span id="count" class="text-sm text-fog"></span>
  </div>

  <section id="grid" class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></section>
  <p id="empty" class="hidden mt-16 text-center text-fog leading-7"></p>

  <p class="mt-12 text-sm text-fog">تُحفظ السكربتات في متصفحك فقط، ولا تُرسل إلى أي خادم.</p>
</main>

<dialog id="modal" class="m-auto w-[min(92vw,34rem)] rounded-xl border border-line bg-panel text-slate-100 p-0">
  <form id="form" class="p-6 flex flex-col gap-4">
    <h2 class="text-xl font-semibold">سكربت جديد</h2>

    <label class="flex flex-col gap-2 text-sm text-fog">العنوان
      <input id="fTitle" required maxlength="80" class="rounded-lg bg-well border border-line px-3 py-2.5 text-slate-100 text-base">
    </label>

    <label class="flex flex-col gap-2 text-sm text-fog">التصنيف
      <select id="fCat" class="rounded-lg bg-well border border-line px-3 py-2.5 text-slate-100 text-base"></select>
    </label>

    <label class="flex flex-col gap-2 text-sm text-fog">الكود
      <textarea id="fCode" required dir="ltr" spellcheck="false"
        class="h-48 resize-y rounded-lg bg-well border border-line px-3 py-2.5 text-slate-100 font-mono text-[13px] leading-6 text-left"
        placeholder="الصق الكود هنا"></textarea>
    </label>

    <div class="flex gap-3 justify-end pt-2">
      <button type="button" id="cancelBtn" class="rounded-lg border border-line px-4 py-2.5 text-fog hover:text-slate-100">إلغاء</button>
      <button type="submit" class="rounded-lg bg-accent text-ink font-semibold px-5 py-2.5 hover:brightness-110">حفظ السكربت</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"
  class="fixed bottom-6 left-1/2 -translate-x-1/2 rounded-lg bg-panel border border-line px-4 py-2.5 text-sm shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

<script>
const KEY = 'devvault.snippets.v1';
const CATS = ['Python', 'Bash', 'ADB'];
const COLORS = { Python: '#f2c14e', Bash: '#6fcf97', ADB: '#c58bff' };

const DEFAULTS = [
  { id: 'd1', title: 'فحص الشبكة المحلية بـ nmap', category: 'Bash',
    code: '# Scan services on your own local network\nnmap -sV -T4 -p 1-1000 192.168.1.0/24' },
  { id: 'd2', title: 'تثبيت ملف APK على الجهاز', category: 'ADB',
    code: '# Install (or reinstall) an APK on the connected device\nadb install -r app.apk' },
  { id: 'd3', title: 'عرض ملفات المجلد وأحجامها', category: 'Python',
    code: 'import os\n\nfor name in sorted(os.listdir(".")):\n    size = os.path.getsize(name)\n    print(f"{name:<30} {size} bytes")' }
];

const $ = s => document.querySelector(s);
const grid = $('#grid'), emptyEl = $('#empty'), countEl = $('#count'), chipsEl = $('#chips');
const modal = $('#modal'), form = $('#form');

let query = '', cat = 'all';
let items = load();

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw !== null) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) { /* storage unavailable: fall through to defaults */ }
  const seeded = DEFAULTS.map(d => ({ ...d }));
  try { localStorage.setItem(KEY, JSON.stringify(seeded)); } catch (e) {}
  return seeded;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch (e) { toast('تعذّر الحفظ في المتصفح'); }
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('opacity-0'), 1800);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = el('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('تم نسخ الكود');
}

function renderChips() {
  chipsEl.replaceChildren();
  ['all', ...CATS].forEach(c => {
    const active = c === cat;
    const b = el('button',
      'rounded-full border px-4 py-1.5 text-sm ' +
      (active ? 'bg-accent text-ink border-accent font-semibold' : 'border-line text-fog hover:text-slate-100'),
      c === 'all' ? 'الكل' : c);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(active));
    b.addEventListener('click', () => { cat = c; renderChips(); render(); });
    chipsEl.append(b);
  });
}

function card(item) {
  const color = COLORS[item.category] || '#8a96ad';
  const a = el('article', 'flex flex-col rounded-xl border border-line bg-panel overflow-hidden');

  const stripe = el('div', 'h-1');
  stripe.style.background = color;

  const head = el('div', 'flex items-start justify-between gap-3 p-4 pb-3');
  head.append(el('h2', 'font-medium leading-7', item.title));
  const badge = el('span', 'shrink-0 inline-flex items-center gap-2 font-mono text-xs text-fog mt-1');
  const dot = el('span', 'h-2 w-2 rounded-full');
  dot.style.background = color;
  badge.append(dot, document.createTextNode(item.category));
  head.append(badge);

  const pre = el('pre', 'flex-1 font-mono text-[13px] leading-6 bg-well text-slate-200 px-4 py-3 overflow-x-auto max-h-56 text-left');
  pre.dir = 'ltr';
  pre.append(el('code', '', item.code));

  const actions = el('div', 'flex gap-2 p-3');
  const copyBtn = el('button', 'flex-1 rounded-lg border border-line px-3 py-2 text-sm hover:border-accent hover:text-accent', 'نسخ الكود');
  copyBtn.type = 'button';
  copyBtn.addEventListener('click', () => copyText(item.code));
  const delBtn = el('button', 'rounded-lg border border-line px-3 py-2 text-sm text-fog hover:border-red-400 hover:text-red-400', 'حذف');
  delBtn.type = 'button';
  delBtn.setAttribute('aria-label', 'حذف ' + item.title);
  delBtn.addEventListener('click', () => {
    if (!confirm('هل تريد حذف هذا السكربت؟')) return;
    items = items.filter(i => i.id !== item.id);
    save(); render(); toast('تم حذف السكربت');
  });
  actions.append(copyBtn, delBtn);

  a.append(stripe, head, pre, actions);
  return a;
}

function render() {
  const q = query.trim().toLowerCase();
  const list = items.filter(i =>
    (cat === 'all' || i.category === cat) &&
    (!q || i.title.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)));
  grid.replaceChildren(...list.map(card));
  countEl.textContent = list.length + ' من ' + items.length + ' سكربت';
  emptyEl.classList.toggle('hidden', list.length > 0);
  emptyEl.textContent = items.length === 0
    ? 'الخزينة فارغة. أضف أول سكربت لك.'
    : 'لا توجد نتائج مطابقة. جرّب كلمة أخرى أو تصنيفاً آخر.';
}

$('#search').addEventListener('input', e => { query = e.target.value; render(); });

$('#fCat').append(...CATS.map(c => { const o = el('option', '', c); o.value = c; return o; }));

$('#addBtn').addEventListener('click', () => { form.reset(); modal.showModal(); $('#fTitle').focus(); });
$('#cancelBtn').addEventListener('click', () => modal.close());
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });

form.addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#fTitle').value.trim();
  const code = $('#fCode').value.replace(/\s+$/, '');
  if (!title || !code.trim()) return;
  items.unshift({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title, category: $('#fCat').value, code
  });
  save();
  cat = 'all'; query = ''; $('#search').value = '';
  modal.close();
  renderChips(); render();
  toast('تمت إضافة السكربت');
});

renderChips();
render();
</script>
</body>
</html>
