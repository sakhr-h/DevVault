<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevVault | خزينة المطور</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- الشريط العلوي -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wide text-emerald-400">DevVault</h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- أزرار التصدير والاستيراد الجديده -->
                <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5" title="تصدير النسخة الاحتياطية">
                    📤 تصدير
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-medium transition cursor-pointer flex items-center gap-1.5" title="استيراد البيانات">
                    📥 استيراد
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    + إضافة سكربت
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- شريط البحث والتصنيف -->
        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <input type="text" id="searchInput" placeholder="ابحث عن أمر ADB، سكربت بايثون، أو أداة..." oninput="renderSnippets()"
                class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
            <select id="categoryFilter" onchange="renderSnippets()" class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                <option value="all">جميع التصنيفات</option>
                <option value="Python">Python</option>
                <option value="Bash / Linux">Bash / Linux</option>
                <option value="ADB & Android">ADB & Android</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>

        <!-- شبكة البطاقات -->
        <div id="snippetsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم تعبئتها تلقائياً عبر الجافاسكريبت -->
        </div>
    </main>

    <!-- نافذة منبثقة لإضافة سكربت جديد (Modal) -->
    <div id="snippetModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
            <h2 class="text-lg font-bold text-emerald-400 mb-4">إضافة سكربت أو أمر جديد</h2>
            <form id="snippetForm" onsubmit="saveSnippet(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">عنوان السكربت</label>
                    <input type="text" id="snippetTitle" required placeholder="مثال: فحص المنافذ المفتوحة"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">التصنيف</label>
                    <select id="snippetCategory" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="Python">Python</option>
                        <option value="Bash / Linux">Bash / Linux</option>
                        <option value="ADB & Android">ADB & Android</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">الكود أو الأمر</label>
                    <textarea id="snippetCode" rows="4" required placeholder="nmap -sV 192.168.1.1"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm font-mono text-left dir-ltr focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm transition">إلغاء</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm transition">حفظ السكربت</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // البيانات الافتراضية إذا كانت الخزينة فارغة
        let snippets = JSON.parse(localStorage.getItem('devvault_snippets')) || [
            { id: 1, title: 'فحص المنافذ المفتوحة محلياً', category: 'Bash / Linux', code: 'nmap -sV -T4 192.168.1.1' },
            { id: 2, title: 'تثبيت تطبيق APK عبر ADB', category: 'ADB & Android', code: 'adb install -r hammel_signed.apk' },
            { id: 3, title: 'سيرفر HTTP سريع بلغة بايثون', category: 'Python', code: 'python3 -m http.server 8000' }
        ];

        function saveToStorage() {
            localStorage.setItem('devvault_snippets', JSON.stringify(snippets));
        }

        function renderSnippets() {
            const grid = document.getElementById('snippetsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('categoryFilter').value;

            grid.innerHTML = '';

            const filtered = snippets.filter(s => {
                const matchesSearch = s.title.toLowerCase().includes(search) || s.code.toLowerCase().includes(search);
                const matchesFilter = filter === 'all' || s.category === filter;
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-slate-500 col-span-full text-center py-10">لا توجد سكربتات مطابقة للبحث.</p>`;
                return;
            }

            filtered.forEach(s => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-mono px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${s.category}</span>
                                <div class="flex gap-2">
                                    <button onclick="copyCode(this)" class="text-xs text-slate-400 hover:text-white transition">نسخ</button>
                                    <button onclick="deleteSnippet(${s.id})" class="text-xs text-rose-400 hover:text-rose-300 transition">حذف</button>
                                </div>
                            </div>
                            <h3 class="font-semibold text-lg mb-2">${s.title}</h3>
                            <pre class="bg-slate-950 p-3 rounded-lg text-xs font-mono text-slate-300 overflow-x-auto dir-ltr text-left"><code>${escapeHtml(s.code)}</code></pre>
                        </div>
                    </div>
                `;
            });
        }

        function openModal() {
            document.getElementById('snippetModal').classList.remove('hidden');
            document.getElementById('snippetModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('snippetModal').classList.remove('flex');
            document.getElementById('snippetModal').classList.add('hidden');
            document.getElementById('snippetForm').reset();
        }

        function saveSnippet(e) {
            e.preventDefault();
            const newSnippet = {
                id: Date.now(),
                title: document.getElementById('snippetTitle').value,
                category: document.getElementById('snippetCategory').value,
                code: document.getElementById('snippetCode').value
            };
            snippets.unshift(newSnippet);
            saveToStorage();
            renderSnippets();
            closeModal();
        }

        function deleteSnippet(id) {
            if(confirm('هل أنت متأكد من حذف هذا السكربت؟')) {
                snippets = snippets.filter(s => s.id !== id);
                saveToStorage();
                renderSnippets();
            }
        }

        function copyCode(btn) {
            const code = btn.closest('div').parentElement.querySelector('code').innerText;
            navigator.clipboard.writeText(code);
            const originalText = btn.innerText;
            btn.innerText = 'تم!';
            setTimeout(() => btn.innerText = originalText, 1500);
        }

        // ميزة التصدير إلى ملف JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(snippets, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `devvault_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // ميزة الاستيراد من ملف JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        snippets = imported;
                        saveToStorage();
                        renderSnippets();
                        alert('تم استيراد السكربتات بنجاح!');
                    } else {
                        alert('ملف غير صالح.');
                    }
                } catch (err) {
                    alert('حدث خطأ أثناء قراءة الملف.');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // إعادة تعيين الحقل
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // تشغيل العرض عند تحميل الصفحة
        renderSnippets();
    </script>
</body>
</html>
